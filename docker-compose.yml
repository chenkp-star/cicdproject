services:
  web:
    build: .
    image: simple-cicd-pages:local
    ports:
      - "8080:80"
    restart: unless-stopped

  jenkins:
    image: jenkins/jenkins:lts-jdk21
    profiles: [ci]
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home

volumes:
  jenkins_home:
